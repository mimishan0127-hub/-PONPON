name: Supabase 2-Day Keep Alive
on:
  schedule:
    - cron: '0 2 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_tRwTx61NXZ7PzVnVGtMY7Q_DGS821nW" \
            "https://rmwkzmohwydjqrwrvmid.supabase.co/rest/v1/bakery_sync?select=id&limit=1")
          echo "Supabase 回應狀態碼: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ 小山PON 資料庫喚醒成功！"
          else
            echo "❌ 喚醒失敗 (狀態碼 $STATUS)，請確認已於 Supabase SQL Editor 建立 bakery_sync 資料表"
            exit 1
          fi
